# Builds the image for Appdonia - platform deployment and pushes it to this
# project's GitLab container registry:
#   registry.gitlab.com/appdonia/<business>/<project>
# Pushes to the default branch publish "latest"; a git tag v1.2.0 publishes
# "1.2.0".

stages: [build]

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - TAG="${CI_COMMIT_TAG#v}"; TAG="${TAG:-latest}"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
